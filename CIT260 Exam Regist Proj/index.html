
<!DOCTYPE html>
<html lang="en">

<!--Title on Tab & linking css style & linking js func-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSN Exam Registration System</title>
    <link rel="stylesheet" href="./css/site.css"/>
    <script src="./js/index.js"></script>
</head>

<!--Sign in Page #1-->
<body>
    <!--container for background (wraps the body)-->
    <div class="container">

        <!--HEADER & LOGO-->
        <div class="header">
            <div class="logo">
                <img src="./assets/csn-logo2.png"/>
            </div>
                
            <h1>CSN Home of The Coyotes</h1>
        </div>

        <!--Card(Input Boxes for Email, Password, and Etc)-->
        <div class="card">
            <!--Title for the Card-->
            <h2><center>Welcome to CSN Exam Registration</center></h2>
    
            <!--Email input field & label-->
            <div class="field">
                <label for="email">Email Address</label>

                <div class="input-wrap">
                    <input type="email" id="email" placeholder="e.g student or faculty" autocomplete="username" required>
                </div>
            </div>
    
            <!--Password input field, lable, & Password visibility button-->
            <div class="field">
                <label for="password">Password</label>

                <div class="input-wrap">
                    <input type="password" id="password" placeholder="password(NSHE)" autocomplete="current-password" required>
                    <button type="button" class="toggle-visibility" id="toggleBtn" aria-label="Show password">👁</button>
                </div>
            </div>
 
            <!--Signin button-->
            <button type="button" class="signin-btn">Sign In</button>

            <div class="note">
                Need Help? OTS: <a href="tel:7025551234">702-555-1234</a>
                CSN home page: <a href="https://csn.edu">csn.edu</a>
            </div>
        </div>

    </div>
</body>
</html>
